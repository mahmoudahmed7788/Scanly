name: tesseract_ocr
description: Tesseract OCR plugin for Flutter
version: 0.5.0

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0
  path_provider: ^2.0.2
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.paratoner.tesseract_ocr
        pluginClass: TesseractOcrPlugin