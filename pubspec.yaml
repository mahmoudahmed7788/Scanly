name: scanly
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  go_router: ^18.0.1

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.0.0
  cloud_firestore: ^6.0.2

  flutter_bloc: ^9.1.1

  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0

  image_picker: ^1.1.2
  file_picker: ^10.3.3
  flutter_quill: ^11.5.0

  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0

  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  share_plus: ^11.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

  image_gallery_saver_plus: ^4.0.1

  pdf: ^3.11.3
  printing: ^5.14.2
  pdfx: ^2.9.2

  google_mlkit_text_recognition: ^0.17.1

  tesseract_ocr:
    path: ./tesseract_ocr

  flutter_tts: ^4.2.5
  flutter_local_notifications: ^19.5.0

  image: ^4.9.2
  supabase_flutter: ^2.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/Scanly_Icon.png
    - assets/images/Scanly_Splash.png
    - assets/images/OnBoarding_1.png
    - assets/images/OnBoarding_2.png
    - assets/images/OnBoarding_3.png
    - assets/images/Launch_Page.png
    - assets/tessdata/
    - assets/tessdata_config.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700

    - family: Roboto Slab
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#000000"

  image: assets/images/Scanly_Splash.png

  android: true
  ios: false
  fullscreen: true

  android_12:
    color: "#000000"
    image: assets/images/Scanly_Splash.png
    icon_background_color: "#000000"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Scanly_Icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/Scanly_Icon.png"